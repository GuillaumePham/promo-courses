# Récupère les offres Coupon Network et met à jour offres.js dans le dépôt.
# Pour l'instant, c'est le PC qui publie les offres chaque semaine (tâche Windows + recuperer_offres.py) :
# les Actions GitHub sont bloquées sur ce compte. Une fois débloquées, on peut remettre la planification :
#   schedule:
#     - cron: "30 9 * * 3,4"   # mercredi et jeudi, 9 h 30 UTC
name: Offres Coupon Network

on:
  workflow_dispatch:          # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

jobs:
  offres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 recuperer_offres.py --silencieux
      - name: Enregistrer offres.js s'il a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offres.js
          git diff --cached --quiet || { git commit -m "Offres Coupon Network du $(date +%d/%m/%Y)" && git push; }
